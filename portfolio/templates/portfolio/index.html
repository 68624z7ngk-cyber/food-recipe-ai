<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>ポートフォリオ</title>

        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                margin: 0 auto;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;

                background: #fff7f2;
            }

            .container {
                width: 350px;
                padding: 40px;
                border-radius: 24px;
                background: white;
                text-align: center;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            }

            .app-card {
                display: block;
                margin: 15px 0;
                padding: 20px;
                border-radius: 18px;
                background: #fff7f2;
            }

            .app-card:active {
                transform: scale(0.97);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>ポートフォリオ</h1>
            <p>作ったアプリ</p>

                <a href="/photos/" class="app-card">写真アプリ</a>

                <a href="/calculator/" class="app-card">計算機アプリ</a>

        </div>

    </body>
</html>
